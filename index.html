<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Undertale Battle Simulator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #111318;
      color: #f5f5f5;
    }

    body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
    }

    p {
      color: #c4c7d0;
      line-height: 1.6;
    }

    #game {
      position: relative;
      width: 100%;
      min-height: 480px;
      margin-top: 20px;
      overflow: hidden;
      background: #000;
      border: 1px solid #444854;
      border-radius: 12px;
    }

    #game .ejs_start_button {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      z-index: 20;
      transform: translate(-50%, -50%) !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 12px;
      }

      #game {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Undertale Battle Simulator</h1>
    <p>Click <strong>Start Game</strong></p>
    <div id="game" aria-label="NES game player"></div>
  </main>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "nes";
    window.EJS_gameName = "Undertale Battle Simulator";
    window.EJS_gameUrl = new URL("./Undertale.nes", document.baseURI).href;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = false;
    window.EJS_defaultControls = {
      0: {
        0: { value: "x", value2: "BUTTON_2" },
        1: { value: "z", value2: "BUTTON_4" },
        2: { value: "", value2: "" },
        3: { value: "enter", value2: "START" },
        4: { value: "w", value2: "DPAD_UP" },
        5: { value: "s", value2: "DPAD_DOWN" },
        6: { value: "a", value2: "DPAD_LEFT" },
        7: { value: "d", value2: "DPAD_RIGHT" },
        8: { value: "k", value2: "BUTTON_1" },
        9: { value: "c", value2: "BUTTON_3" },
        10: { value: "q", value2: "LEFT_TOP_SHOULDER" },
        11: { value: "e", value2: "RIGHT_TOP_SHOULDER" },
        12: { value: "tab", value2: "LEFT_BOTTOM_SHOULDER" },
        13: { value: "r", value2: "RIGHT_BOTTOM_SHOULDER" },
        14: { value: "", value2: "LEFT_STICK" },
        15: { value: "", value2: "RIGHT_STICK" },
        16: { value: "h", value2: "LEFT_STICK_X:+1" },
        17: { value: "f", value2: "LEFT_STICK_X:-1" },
        18: { value: "g", value2: "LEFT_STICK_Y:+1" },
        19: { value: "t", value2: "LEFT_STICK_Y:-1" },
        20: { value: "l", value2: "RIGHT_STICK_X:+1" },
        21: { value: "j", value2: "RIGHT_STICK_X:-1" },
        22: { value: "o", value2: "RIGHT_STICK_Y:+1" },
        23: { value: "i", value2: "RIGHT_STICK_Y:-1" },
        24: { value: "1" },
        25: { value: "2" },
        26: { value: "3" },
        27: {},
        28: {},
        29: {}
      },
      1: {},
      2: {},
      3: {}
    };
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
